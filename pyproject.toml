[project]
name = "ptm"
version = "0.0.1"
description = "Personnel-tenure models: survival analysis and calibration for Kalshi departure markets"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27,<1",
    "pandas>=2.2,<3",
    "pyarrow>=17,<20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6,<1",
]

[project.scripts]
ptm-collect = "ptm.collector.snapshot:main"
ptm-discover = "ptm.collector.discover:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ptm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
